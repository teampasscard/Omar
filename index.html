<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>عمرو عصام هاشم محمد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;900&family=Changa:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Lateef:wght@400;700&family=Mada:wght@400;600;700&family=Marhey:wght@400;600;700&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body {
      min-height: 100svh; display: grid; place-items: center; overflow-x: hidden;
      background: #000; color: #fff;
      font-family: "Cairo", sans-serif;
    }
    main {
      width: min(100%, 760px); min-height: 100svh; padding: 28px 20px 46px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(24px, 5vh, 44px);
    }
    .portrait-wrap {
      width: min(72vw, 360px); aspect-ratio: 9 / 16; max-height: 56svh;
      border-radius: 24px; overflow: hidden; background: #0b0b0b;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 18px 70px rgba(255,255,255,.07);
      animation: portraitIn 1.1s cubic-bezier(.2,.8,.2,1) both;
    }
    .portrait { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 28%; }
    h1 {
      margin: 0; width: 100%; text-align: center; line-height: 1.65;
      font-size: clamp(2rem, 7vw, 4.2rem); font-weight: 700;
      color: #fff; text-wrap: balance; animation: nameFloat 3.2s ease-in-out infinite;
      text-shadow: 0 0 28px rgba(255,255,255,.16);
      transition: font-family .45s ease;
    }
    @keyframes nameFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    @keyframes portraitIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 480px) {
      main { gap: 28px; padding: 22px 18px 34px; }
      .portrait-wrap { width: min(70vw, 300px); max-height: 52svh; border-radius: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main aria-label="عمرو عصام هاشم محمد">
    <div class="portrait-wrap">
      <img class="portrait" src="assets/omar.jpg" alt="" fetchpriority="high">
    </div>
    <h1 id="name">عمرو عصام هاشم محمد</h1>
  </main>
  <script>
    const name = document.getElementById('name');
    const fonts = [
      '"Cairo", sans-serif', '"Tajawal", sans-serif', '"Amiri", serif',
      '"Aref Ruqaa", serif', '"Changa", sans-serif', '"IBM Plex Sans Arabic", sans-serif',
      '"Mada", sans-serif', '"Reem Kufi", sans-serif', '"Lateef", serif', '"Marhey", sans-serif'
    ];
    let current = 0;
    setInterval(() => {
      current = (current + 1) % fonts.length;
      name.style.fontFamily = fonts[current];
    }, 1700);
  </script>
</body>
</html>
