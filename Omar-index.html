  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }

    main { width: min(100%, 760px); min-height: 100svh; margin: 0 auto; padding: 28px 20px 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(24px, 5vh, 44px); }
    .portrait-wrap { width: min(72vw, 360px); aspect-ratio: 9 / 16; max-height: 56svh; border-radius: 24px; overflow: hidden; background: #0b0b0b; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 18px 70px rgba(255,255,255,.07); animation: portraitIn 1s cubic-bezier(.2,.8,.2,1) both; }

    h1 { margin: 0; width: 100%; text-align: center; line-height: 1.65; font-size: clamp(2rem, 7vw, 4.2rem); font-weight: 700; color: #fff; text-wrap: balance; animation: nameFloat 3.2s ease-in-out infinite; text-shadow: 0 0 28px rgba(255,255,255,.16); transition: font-family .4s ease; }
    @keyframes nameFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes portraitIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 480px) { main { gap: 28px; padding: 22px 18px 34px; } .portrait-wrap { width: min(70vw, 300px); max-height: 52svh; border-radius: 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
